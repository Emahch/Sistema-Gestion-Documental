<section class="shared">
  <div class="shared-head">
    <div>
      <h1>{{ title() }}</h1>
      <p class="subtitle">{{ subtitle() }} ({{ total() }})</p>
    </div>
    <div class="shared-tools">
      <p-button
        [icon]="layout() === 'list' ? 'pi pi-th-large' : 'pi pi-bars'"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        ariaLabel="Alternar vista de lista y cuadrícula"
        (onClick)="layout.set(layout() === 'list' ? 'grid' : 'list')"
      />
    </div>
  </div>

  @if (error()) {
    <div class="error-banner">{{ error() }}</div>
  }

  <app-drive-view
    [items]="viewItems()"
    [layout]="layout()"
    [loading]="loading()"
    [emptyText]="
      mode() === 'by-me'
        ? 'Todavía no has compartido nada.'
        : 'Todavía nadie te ha compartido nada.'
    "
    (activate)="activateItem($event)"
    (menu)="openItemMenu($event.event, $event.item)"
  />
  <p-menu #itemMenu [model]="menuItems()" [popup]="true" />
</section>

<app-permissions-dialog
  [(visible)]="showPermissions"
  [resourceType]="permTarget()?.kind ?? 'folder'"
  [resourceId]="permTarget()?.id ?? ''"
  [resourceName]="permTarget()?.name ?? ''"
/>
