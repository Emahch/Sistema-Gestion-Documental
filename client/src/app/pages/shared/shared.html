<section class="shared">
  <div class="shared-head">
    <div>
      <h1>{{ title() }}</h1>
      <p class="subtitle">{{ subtitle() }} ({{ total() }})</p>
    </div>
    <div class="shared-tools">
      <p-button
        [icon]="layout() === 'list' ? 'pi pi-th-large' : 'pi pi-bars'"
        [text]="true"
        [rounded]="true"
        severity="secondary"
        ariaLabel="Alternar vista de lista y cuadrícula"
        (onClick)="layout.set(layout() === 'list' ? 'grid' : 'list')"
      />
    </div>
  </div>

  @if (error()) {
    <div class="error-banner">{{ error() }}</div>
  }

  <app-drive-view
    [items]="viewItems()"
    [layout]="layout()"
    [loading]="loading()"
    [emptyText]="
      mode() === 'by-me'
        ? 'Todavía no has compartido nada.'
        : 'Todavía nadie te ha compartido nada.'
    "
    (activate)="activateItem($event)"
    (menu)="openItemMenu($event.event, $event.item)"
  />
  <p-menu #itemMenu [model]="menuItems()" [popup]="true" />
  <p-confirmDialog />
</section>

<app-permissions-dialog
  [(visible)]="showPermissions"
  [resourceType]="permTarget()?.kind ?? 'folder'"
  [resourceId]="permTarget()?.id ?? ''"
  [resourceName]="permTarget()?.name ?? ''"
/>

<app-file-editor-dialog />

<p-dialog header="Renombrar" [visible]="showRename()" [modal]="true" [style]="{ width: '380px' }" (visibleChange)="showRename.set($event)">
  <div class="dialog-form">
    <label>Nombre</label>
    <input pInputText [(ngModel)]="renameName" (keyup.enter)="saveRenameShared()" />
    @if (renameError()) {
      <small class="error">{{ renameError() }}</small>
    }
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" [text]="true" (onClick)="showRename.set(false)" />
    <p-button label="Guardar" (onClick)="saveRenameShared()" [loading]="renaming()" />
  </ng-template>
</p-dialog>

<p-dialog header="Mover a" [visible]="showMove()" [modal]="true" [style]="{ width: '420px' }" (visibleChange)="showMove.set($event)">
  <div class="dialog-form">
    <label>Carpeta destino</label>
    <p-select [options]="destinations()" [(ngModel)]="destinationId" placeholder="Selecciona destino" styleClass="full-width" />
    @if (moveError()) {
      <small class="error">{{ moveError() }}</small>
    }
  </div>
  <ng-template pTemplate="footer">
    <p-button label="Cancelar" [text]="true" (onClick)="showMove.set(false)" />
    <p-button label="Mover" (onClick)="saveMoveShared()" [loading]="moving()" />
  </ng-template>
</p-dialog>
